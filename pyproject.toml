[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "single-cell-ids"
version = "0.1.0"
dependencies = ["numpy", "tqdm"]
authors = [
    {name = "Adityanarayanan Radhakrishnan", email = "aradha@mit.edu"},
    {name = "Yajit Jain", email = "yajit@broadinstitute.org"},
    {name = "Caroline Uhler", email = "cuhler@mit.edu"},
    {name = "Eric S. Lander", email = "eric@broadinstitute.org"},
]

description = "InterDependence Scores (IDS) with a single-cell pipeline: batched/streaming wrappers plus a scanpy-based CLI."
license = {text = "MIT"}
requires-python = ">=3.7"

[project.optional-dependencies]
torch = ["torch"]
sc = ["scanpy", "anndata", "scipy"]

[project.scripts]
sc-ids = "sc_ids.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
